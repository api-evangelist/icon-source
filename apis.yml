aid: icon-source
name: Icon Source
description: >-
  Icon Source is a Denver, Colorado marketplace that connects brands, marketing agencies and
  universities with professional and college athletes for endorsement, appearance, speaking and
  social-media deals, including Name, Image and Likeness (NIL) engagements. Founded in 2018 by
  Chase Garrett, the platform lets brands search and filter verified athletes by location,
  interest, rate, audience size and demographics, build and send contracts, and pay athletes
  in-platform, charging a 10% transaction fee on each deal that is signed and closed. A companion
  product, Icon Suite (launched March 2022), gives universities NIL disclosure and compliance
  tooling. Icon Source is delivered strictly as an end-user product — a web application at
  prod.iconsource.app plus iOS and Android apps — and publishes no public API, SDK, developer
  portal or machine-readable contract of any kind.
